<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>123apps 繁體中文全能媒體工具箱</title>
    <script>
      // Single Page Apps for GitHub Pages redirect fallback
      (function() {
        var redirect = window.location.pathname;
        if (redirect && redirect.length > 1) {
          window.location.replace(window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/')) + '/#' + redirect);
        }
      })();
    </script>
  </head>
  <body>
    <script>
      window.location.replace('./index.html');
    </script>
  </body>
</html>
